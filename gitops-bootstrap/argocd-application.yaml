# Apply this once, manually, to the cluster running ArgoCD:
#   kubectl apply -f gitops-bootstrap/argocd-application.yaml
#
# From then on, every manifest merged under gitops/servers/**/manifest.yaml
# or gitops/clusters/**/manifest.yaml is synced automatically. Only
# manifest.yaml files are applied (catalog-info.yaml is Backstage-only
# metadata, not a Kubernetes object).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackit-compute-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/bartvanbenthem/cloud-controlplane-poc.git
    targetRevision: main
    path: gitops
    directory:
      recurse: true
      include: '*/*/manifest.yaml'

  destination:
    server: https://kubernetes.default.svc
    # Namespace of the destination is set per-manifest via metadata.namespace
    # in each Server/Cluster resource; this default only matters for
    # cluster-scoped fallback.
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
