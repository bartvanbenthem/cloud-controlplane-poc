# Copy to 03-secret.yaml, fill in real values, and apply — don't commit
# the filled-in copy. This is a single shared credential gating the whole
# API (see backend/internal/api/middleware.go); anyone with it can
# create/delete any Cluster the service account can reach.
apiVersion: v1
kind: Secret
metadata:
  name: controlplane-portal-auth
  namespace: controlplane-portal
type: Opaque
stringData:
  AUTH_USERNAME: changeme
  AUTH_PASSWORD: changeme
