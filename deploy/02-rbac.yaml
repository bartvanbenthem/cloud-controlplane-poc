# Cluster-scoped because these resources can live in any namespace and the
# portal lists across all of them; the actual grant is still limited to
# these CRDs plus read-only namespace/secret access — no core workload
# access at all, and (with one deliberate exception below, for Grafana) no
# access to the vendor CRDs (CNPG's Cluster, valkey-operator's
# ValkeyCluster, mariadb-operator's MariaDB, RabbitMQ Cluster Operator's
# RabbitmqCluster, Prometheus Operator's Prometheus) these paas.example.com
# CRs front — that's project-easter's own ServiceAccount's job, not this
# portal's.
#
# The "secrets"/get grant is a deliberate, narrow exception to "no core
# workload access": it backs the credentials panel on the
# PostgresCluster/MariaDBCluster/MongoDBCluster/RabbitMQCluster/
# GrafanaInstance detail pages (see backend/internal/api/credentials.go),
# which reads the vendor operator's own auto-generated bootstrap-credentials
# Secret (`<name>-app`/`<name>-root`/`<name>-psmdb-secrets`/
# `<name>-default-user`/`<name>-admin-credentials`).
# RBAC has no way to scope "get" to only secrets matching a name pattern,
# so in principle this SA can `get` any Secret by name in any namespace —
# the backend API only ever constructs those specific derived names itself
# and never accepts an arbitrary secret name from a client, but that's an
# application-level constraint, not one RBAC enforces. This SA still has
# no "list"/"watch" on secrets, so it can't enumerate them.
#
# The "pods"/get+list and "pods/portforward"/create grants are the other
# deliberate exception: they back the "Open Grafana" proxy
# (backend/internal/api/grafana_proxy.go), which reaches a GrafanaInstance's
# UI by tunneling through the API server's portforward subresource — the
# same mechanism `kubectl port-forward` uses — rather than requiring
# cluster-internal Service networking or an Ingress. The proxy handler
# only ever port-forwards to a pod it found itself via an "app=<name>"
# label selector, and only after confirming a GrafanaInstance named
# <name> exists in that namespace, so this can't be used to reach an
# arbitrary pod by name — but RBAC itself doesn't scope portforward to
# Grafana pods specifically, so this SA can port-forward to any pod.
#
# The "grafana.integreatly.org"/"grafanas" get+update grant is the one
# place this portal reaches past its own paas.example.com CRDs into a
# vendor one (see backend/internal/api/grafana_provision.go): Grafana has
# to be told (via that CRD's own spec.config) that it's being served from
# a sub-path, or its assets/redirects break under the "Open Grafana"
# proxy above — GrafanaInstance has no field for this, so there's no way
# to ask project-easter's controller to set it on our behalf. This SA can
# therefore read/modify any vendor Grafana object's config by name, not
# just ones created through this portal — the application only ever does
# so for a GrafanaInstance it just created itself, but RBAC doesn't
# enforce that scoping.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlplane-portal
rules:
  - apiGroups: ["compute.sostackit.dev"]
    resources: ["clusters", "servers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Volume: created internally as a Server's boot disk (see volumeGVR's doc
  # comment in backend/internal/api/resources.go) — never listed/watched
  # since it isn't a portal-facing kind. "update" sets the owner reference
  # to its Server after creation; "delete" only rolls one back if that
  # Server's own create fails.
  - apiGroups: ["compute.sostackit.dev"]
    resources: ["volumes"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["paas.example.com"]
    resources:
      [
        "postgresclusters",
        "valkeyclusters",
        "mariadbclusters",
        "mongodbclusters",
        "rabbitmqclusters",
        "kafkaclusters",
        "grafanainstances",
        "prometheusinstances",
      ]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanas"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlplane-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlplane-portal
subjects:
  - kind: ServiceAccount
    name: controlplane-portal
    namespace: controlplane-portal
