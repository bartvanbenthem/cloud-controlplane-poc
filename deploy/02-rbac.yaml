# Cluster-scoped because these resources can live in any namespace and the
# portal lists across all of them; the actual grant is still limited to
# these CRDs plus read-only namespace/secret access — no core workload
# access at all, and (with one deliberate exception below, for Grafana) no
# access to the vendor CRDs (CNPG's Cluster, valkey-operator's
# ValkeyCluster, mariadb-operator's MariaDB, RabbitMQ Cluster Operator's
# RabbitmqCluster, Prometheus Operator's Prometheus, Loki Operator's
# LokiStack) these paas.example.com CRs front — that's project-easter's own
# ServiceAccount's job, not this portal's.
#
# The "secrets"/get grant is a deliberate, narrow exception to "no core
# workload access": it backs the credentials panel on the
# PostgresCluster/MariaDBCluster/MongoDBCluster/RabbitMQCluster/
# GrafanaInstance detail pages (see backend/internal/api/credentials.go),
# which reads the vendor operator's own auto-generated bootstrap-credentials
# Secret (`<name>-app`/`<name>-root`/`<name>-psmdb-secrets`/
# `<name>-default-user`/`<name>-admin-credentials`).
# RBAC has no way to scope "get" to only secrets matching a name pattern,
# so in principle this SA can `get` any Secret by name in any namespace —
# the backend API only ever constructs those specific derived names itself
# and never accepts an arbitrary secret name from a client, but that's an
# application-level constraint, not one RBAC enforces. This SA still has
# no "list"/"watch" on secrets, so it can't enumerate them.
#
# The "pods"/get+list grant backs the Storage/Volumes page's PVC-attachment
# cross-reference (see below). The portal has no Grafana proxy of any kind
# any more — Grafana is only ever reached through its own Ingress (see
# MonitoringCreate's ingress fields and GrafanaDashboardEmbed.tsx) — so
# there's no portforward/tunnel grant here either.
#
# The "services"/get grant backs the Monitoring detail page's Public IP
# panel (backend/internal/api/expose.go): once a GrafanaInstance is created
# with expose.type: LoadBalancer, reading its external address means
# reading grafana-operator's own generated "<name>-service" Service's
# status.loadBalancer.ingress -- GrafanaInstance's own status has no such
# field, only the underlying Service does. Same shape as the "secrets"/get
# grant above: RBAC can't scope "get" to only Services matching a name
# pattern, so this SA can in principle `get` any Service by name in any
# namespace, but the backend only ever constructs "<name>-service" itself
# for a GrafanaInstance it already confirmed exists. No "list"/"watch" on
# services, so it can't enumerate them.
#
# The "persistentvolumeclaims" grant backs the Storage/Volumes page
# (backend/internal/api/volumes.go): listing PVCs (cross-referenced
# against Pods to show Attached/Detached), and deleting one once it's
# confirmed neither Bound nor attached. "patch" is only ever used to
# strip finalizers on a force-delete of an already-unbound, already-
# detached PVC stuck Terminating.
#
# The "grafana.integreatly.org"/"grafanas" get+update grant is the one
# place this portal reaches past its own paas.example.com CRDs into a
# vendor one (see backend/internal/api/grafana_provision.go): Grafana has
# to be told (via that CRD's own spec.config) to allow embedding and accept
# anonymous Viewer sessions, or GrafanaDashboardEmbed.tsx's <iframe> can't
# render it inline on a resource's own detail page — GrafanaInstance has no
# field for either, so there's no way to ask project-easter's controller to
# set them on our behalf. This SA can therefore read/modify any vendor
# Grafana object's config by name, not just ones created through this
# portal — the application only ever does so for a GrafanaInstance it just
# created itself (and only when it was given an ingress host — see
# provisionGrafanaEmbedding), but RBAC doesn't enforce that scoping.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlplane-portal
rules:
  - apiGroups: ["compute.sostackit.dev"]
    resources: ["clusters", "servers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Volume: created internally as a Server's boot disk (see volumeGVR's doc
  # comment in backend/internal/api/resources.go) — never listed/watched
  # since it isn't a portal-facing kind. "update" sets the owner reference
  # to its Server after creation; "delete" only rolls one back if that
  # Server's own create fails.
  - apiGroups: ["compute.sostackit.dev"]
    resources: ["volumes"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["paas.example.com"]
    resources:
      [
        "postgresclusters",
        "valkeyclusters",
        "mariadbclusters",
        "mongodbclusters",
        "rabbitmqclusters",
        "kafkaclusters",
        "prometheusinstances",
        "lokiinstances",
        "alloyinstances",
      ]
    verbs: ["get", "list", "watch", "create", "delete"]
  # grafanainstances gets its own rule, split out from the block above,
  # for the extra "patch" verb: MonitoringDetail's Loki-datasource editor
  # (backend/internal/api/handlers.go's handlePatch) lets you set/clear an
  # existing GrafanaInstance's spec.lokiRef via a JSON merge patch instead
  # of live-patching the cluster by hand. No other paas.example.com kind is
  # editable through the portal yet, so none of the others need it.
  - apiGroups: ["paas.example.com"]
    resources: ["grafanainstances"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanas"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlplane-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlplane-portal
subjects:
  - kind: ServiceAccount
    name: controlplane-portal
    namespace: controlplane-portal
