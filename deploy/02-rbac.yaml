# Cluster-scoped because these resources can live in any namespace and the
# portal lists across all of them; the actual grant is still limited to
# these CRDs plus read-only namespace listing (used by the create-form
# namespace picker) — no core workload access at all, and no access to the
# vendor CRDs (CNPG's Cluster, valkey-operator's ValkeyCluster,
# mariadb-operator's MariaDB, RabbitMQ Cluster Operator's RabbitmqCluster,
# grafana-operator's Grafana, Prometheus Operator's Prometheus) these
# paas.example.com CRs front — that's project-easter's own ServiceAccount's
# job, not this portal's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlplane-portal
rules:
  - apiGroups: ["compute.sostackit.dev"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["paas.example.com"]
    resources:
      [
        "postgresclusters",
        "valkeyclusters",
        "mariadbclusters",
        "rabbitmqclusters",
        "grafanainstances",
        "prometheusinstances",
      ]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlplane-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlplane-portal
subjects:
  - kind: ServiceAccount
    name: controlplane-portal
    namespace: controlplane-portal
