apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane-portal
  namespace: controlplane-portal
  labels:
    app: controlplane-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controlplane-portal
  template:
    metadata:
      labels:
        app: controlplane-portal
    spec:
      serviceAccountName: controlplane-portal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/bartvanbenthem/cloud-controlplane-portal:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: controlplane-portal-auth
                optional: true
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
