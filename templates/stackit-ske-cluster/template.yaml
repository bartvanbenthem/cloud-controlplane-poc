apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: stackit-ske-cluster
  title: STACKIT SKE Cluster
  description: >-
    Provision a STACKIT Kubernetes Engine (SKE) cluster via the
    stackit-compute-operator. Generates a Cluster custom resource manifest
    with one worker node pool and opens a pull request into
    gitops/clusters/, which ArgoCD applies once merged.
  tags: [stackit, ske, kubernetes, cluster]
spec:
  owner: group:platform-team
  type: infrastructure

  parameters:
    - title: Cluster identity
      required: [name, projectId, region]
      properties:
        name:
          title: Name
          type: string
          description: >-
            Cluster name. This is SKE's only identifier for the cluster
            (there is no separate UUID) and cannot be changed after creation.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        namespace:
          title: Namespace
          type: string
          description: Kubernetes namespace the Cluster resource is created in.
          default: default
        projectId:
          title: STACKIT project ID
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        region:
          title: Region
          type: string
          default: eu01
        owner:
          title: Owner
          type: string
          description: Owner of the resulting catalog component.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Kubernetes version
      required: [kubernetesVersion]
      properties:
        kubernetesVersion:
          title: Kubernetes version
          type: string
          description: See STACKIT's SKE provider-options for valid versions.
          pattern: '^\d+\.\d+\.\d+$'
          default: '1.31.1'

    - title: Default node pool
      required:
        - poolName
        - poolMachineType
        - poolAvailabilityZones
        - poolMinimum
        - poolMaximum
        - poolVolumeSize
      properties:
        poolName:
          title: Node pool name
          type: string
          description: Max 15 characters.
          maxLength: 15
          default: pool-1
        poolMachineType:
          title: Machine type
          type: string
          default: c2i.2
        poolMachineImageName:
          title: Machine image
          type: string
          default: flatcar
        poolMachineImageVersion:
          title: Machine image version
          type: string
          default: '4593.2.2'
        poolAvailabilityZones:
          title: Availability zones
          type: array
          items:
            type: string
          default: ['eu01-1']
        poolMinimum:
          title: Minimum nodes
          type: integer
          default: 1
          minimum: 0
        poolMaximum:
          title: Maximum nodes
          type: integer
          default: 3
          minimum: 1
        poolVolumeSize:
          title: Node volume size (GB)
          type: integer
          default: 32
          minimum: 1

    - title: Maintenance window
      properties:
        autoUpdateKubernetesVersion:
          title: Auto-update Kubernetes patch version
          type: boolean
          default: true
        autoUpdateMachineImageVersion:
          title: Auto-update machine image version
          type: boolean
          default: true
        maintenanceStart:
          title: Maintenance window start (RFC3339)
          type: string
          description: Only time-of-day/day-of-week are meaningful to SKE.
          default: '2024-01-01T02:00:00Z'
        maintenanceEnd:
          title: Maintenance window end (RFC3339)
          type: string
          default: '2024-01-01T04:00:00Z'

    - title: Labels
      properties:
        environment:
          title: Environment label
          type: string
          enum: [dev, staging, prod]
          default: dev
        team:
          title: Team label
          type: string

    - title: Where to publish the manifest
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [bartvanbenthem]
            allowedRepos: [cloud-controlplane-poc]

  steps:
    - id: fetch
      name: Render manifest
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./output
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          projectId: ${{ parameters.projectId }}
          region: ${{ parameters.region }}
          kubernetesVersion: ${{ parameters.kubernetesVersion }}
          poolName: ${{ parameters.poolName }}
          poolMachineType: ${{ parameters.poolMachineType }}
          poolMachineImageName: ${{ parameters.poolMachineImageName }}
          poolMachineImageVersion: ${{ parameters.poolMachineImageVersion }}
          poolAvailabilityZones: ${{ parameters.poolAvailabilityZones }}
          poolMinimum: ${{ parameters.poolMinimum }}
          poolMaximum: ${{ parameters.poolMaximum }}
          poolVolumeSize: ${{ parameters.poolVolumeSize }}
          autoUpdateKubernetesVersion: ${{ parameters.autoUpdateKubernetesVersion }}
          autoUpdateMachineImageVersion: ${{ parameters.autoUpdateMachineImageVersion }}
          maintenanceStart: ${{ parameters.maintenanceStart }}
          maintenanceEnd: ${{ parameters.maintenanceEnd }}
          environment: ${{ parameters.environment }}
          team: ${{ parameters.team }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Open pull request into gitops/
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: create-ske-cluster-${{ parameters.name }}
        title: 'Add STACKIT SKE Cluster: ${{ parameters.name }}'
        description: |
          Adds the `${{ parameters.name }}` SKE Cluster manifest, opened from
          the STACKIT SKE Cluster Backstage template.

          Once merged, ArgoCD applies this to the cluster and the
          stackit-compute-operator provisions the cluster in STACKIT project
          `${{ parameters.projectId }}` / region `${{ parameters.region }}`.
        targetPath: gitops/clusters/${{ parameters.name }}
        sourcePath: ./output

  output:
    links:
      - title: Pull request
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Manifest source (after merge)
        url: ${{ parameters.repoUrl }}
