apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: stackit-server
  title: STACKIT Server
  description: >-
    Provision a STACKIT Compute Engine server (virtual machine) via the
    stackit-compute-operator. Generates a Server custom resource manifest and
    opens a pull request into gitops/servers/, which ArgoCD applies once
    merged.
  tags: [stackit, compute, server, iaas, kubernetes]
spec:
  owner: group:platform-team
  type: infrastructure

  parameters:
    - title: Server identity
      required: [name, projectId, region]
      properties:
        name:
          title: Name
          type: string
          description: >-
            Name of the Server resource and, unless overridden below, the
            server as it appears in STACKIT. Lowercase alphanumeric and
            hyphens only.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        namespace:
          title: Namespace
          type: string
          description: Kubernetes namespace the Server resource is created in.
          default: default
        projectId:
          title: STACKIT project ID
          type: string
          description: UUID of the STACKIT project the server belongs to.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        region:
          title: Region
          type: string
          default: eu01
        owner:
          title: Owner
          type: string
          description: Owner of the resulting catalog component.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Compute
      required: [machineType]
      properties:
        machineType:
          title: Machine type
          type: string
          description: STACKIT flavor, e.g. c1.2, c2i.4.
          default: c1.2
        availabilityZone:
          title: Availability zone
          type: string
          description: e.g. eu01-1. Leave empty to let STACKIT choose.
        powerState:
          title: Power state
          type: string
          enum: [Active, Inactive]
          default: Active

    - title: Image and boot volume
      required: [imageId]
      properties:
        imageId:
          title: Image ID
          type: string
          description: UUID of the image the boot volume is created from.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        bootVolumeSize:
          title: Boot volume size (GB)
          type: integer
          default: 32
          minimum: 1
        bootVolumePerformanceClass:
          title: Boot volume performance class
          type: string
          description: e.g. storage_premium_perf1. Leave empty for the STACKIT default.
        deleteBootVolumeOnTermination:
          title: Delete boot volume on server termination
          type: boolean
          default: true

    - title: Networking and access
      required: [networkId]
      properties:
        networkId:
          title: Network ID
          type: string
          description: UUID of the network the server's primary NIC attaches to.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        keypairName:
          title: SSH keypair name
          type: string
          description: Name of an existing STACKIT SSH keypair to inject.
        securityGroups:
          title: Security group IDs
          type: array
          items:
            type: string
          default: []
        userData:
          title: Cloud-init user data
          type: string
          description: Plain-text cloud-init config; base64-encoded by the operator.
          ui:widget: textarea
          ui:options:
            rows: 8

    - title: Labels
      properties:
        environment:
          title: Environment label
          type: string
          enum: [dev, staging, prod]
          default: dev
        team:
          title: Team label
          type: string

    - title: Where to publish the manifest
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [bartvanbenthem]
            allowedRepos: [cloud-controlplane-poc]

  steps:
    - id: fetch
      name: Render manifest
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./output
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.namespace }}
          projectId: ${{ parameters.projectId }}
          region: ${{ parameters.region }}
          machineType: ${{ parameters.machineType }}
          availabilityZone: ${{ parameters.availabilityZone }}
          powerState: ${{ parameters.powerState }}
          imageId: ${{ parameters.imageId }}
          bootVolumeSize: ${{ parameters.bootVolumeSize }}
          bootVolumePerformanceClass: ${{ parameters.bootVolumePerformanceClass }}
          deleteBootVolumeOnTermination: ${{ parameters.deleteBootVolumeOnTermination }}
          networkId: ${{ parameters.networkId }}
          keypairName: ${{ parameters.keypairName }}
          securityGroups: ${{ parameters.securityGroups }}
          userData: ${{ parameters.userData }}
          environment: ${{ parameters.environment }}
          team: ${{ parameters.team }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Open pull request into gitops/
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: create-server-${{ parameters.name }}
        title: 'Add STACKIT Server: ${{ parameters.name }}'
        description: |
          Adds the `${{ parameters.name }}` Server manifest, opened from the
          STACKIT Server Backstage template.

          Once merged, ArgoCD applies this to the cluster and the
          stackit-compute-operator provisions the server in STACKIT project
          `${{ parameters.projectId }}` / region `${{ parameters.region }}`.
        targetPath: gitops/servers/${{ parameters.name }}
        sourcePath: ./output

  output:
    links:
      - title: Pull request
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Manifest source (after merge)
        url: ${{ parameters.repoUrl }}
